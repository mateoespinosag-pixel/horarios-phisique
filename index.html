<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#46644d"><title>Horarios Phisique</title><style>:root{--g:#46644d;--g2:#637e69;--bg:#f4f6f4;--line:#dfe5df;--gold:#e5ad31;--text:#17211a;--muted:#66716a}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,#304737,var(--g2));color:#fff;padding:28px 18px}.wrap{max-width:1200px;margin:auto}h1{margin:4px 0 6px;font-size:clamp(26px,5vw,42px)}p{margin:0;color:#e8efe9}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.filters{margin:16px auto}.grid{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}input,select,button{width:100%;padding:11px;border:1px solid #ccd5cd;border-radius:10px;background:#fff;font-size:15px}button{cursor:pointer;font-weight:700;background:var(--g);color:#fff;border-color:var(--g)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 16px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat strong{display:block;font-size:24px;color:var(--g)}.stat span{font-size:12px;color:var(--muted)}.tablebox{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.scroll{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse;min-width:650px}th{position:sticky;top:0;background:#edf2ee;padding:12px;text-align:left;font-size:12px;text-transform:uppercase}td{padding:12px;border-top:1px solid #eef1ee}tr:hover{background:#fbf8ef}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3ef;font-size:12px}.muted{color:var(--muted);font-size:13px;padding:12px 16px}.actions{display:flex;gap:10px;margin-top:10px}.actions button{width:auto}.secondary{background:#eef2ee;color:var(--text)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}header{padding:22px 16px}.filters{margin:12px}.tablebox{border-radius:0;border-left:0;border-right:0}.actions{flex-direction:column}.actions button{width:100%}}</style></head><body><header><div class="wrap"><div style="font-size:12px;letter-spacing:.14em;color:#f0cd74;font-weight:700">PHISIQUE WELLNESS CLUB</div><h1>Buscador interactivo de clases</h1><p>Filtra los horarios Q3 2026 por clase, día, sede y franja horaria.</p></div></header><main class="wrap"><section class="panel filters"><div class="grid"><div><label>Buscar clase</label><input id="q" placeholder="Pilates, BodyPump, Cycling..."></div><div><label>Día</label><select id="day"><option value="">Todos</option></select></div><div><label>Sede</label><select id="site"><option value="">Todas</option></select></div><div><label>Horario</label><select id="period"><option value="">Todo el día</option><option value="am">Antes de 07:00</option><option value="work">07:00 a 17:00</option><option value="pm">Después de 17:00</option></select></div></div><div class="actions"><button id="clear">Limpiar filtros</button><button id="csv" class="secondary">Descargar CSV</button></div></section><section class="stats"><div class="stat"><strong id="n">0</strong><span>horarios encontrados</span></div><div class="stat"><strong id="c">0</strong><span>clases diferentes</span></div><div class="stat"><strong id="s">0</strong><span>sedes disponibles</span></div></section><section class="tablebox"><div class="muted" id="summary"></div><div class="scroll"><table><thead><tr><th>Clase</th><th>Día</th><th>Hora</th><th>Sede</th><th>Duración</th></tr></thead><tbody id="body"></tbody></table></div></section></main><script src="data1.js"></script><script src="data2.js"></script><script src="data_rest.js"></script><script>const DATA=(window.DATA_PARTS||[]).flat();const dayOrder={Lunes:1,Martes:2,"Miércoles":3,Jueves:4,Viernes:5,"Sábado":6};const $=x=>document.getElementById(x);const mins=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();[...new Set(DATA.map(x=>x.dia))].sort((a,b)=>dayOrder[a]-dayOrder[b]).forEach(v=>day.add(new Option(v,v)));[...new Set(DATA.map(x=>x.sede))].sort((a,b)=>a.localeCompare(b,'es')).forEach(v=>site.add(new Option(v,v)));function filtered(){const q=norm($('q').value),d=day.value,st=site.value,p=period.value;return DATA.filter(x=>{const t=mins(x.hora);const ok=!p||(p==='am'&&t<420)||(p==='work'&&t>=420&&t<=1020)||(p==='pm'&&t>1020);return(!q||norm(x.clase).includes(q))&&(!d||x.dia===d)&&(!st||x.sede===st)&&ok}).sort((a,b)=>dayOrder[a.dia]-dayOrder[b.dia]||mins(a.hora)-mins(b.hora)||a.clase.localeCompare(b.clase,'es'))}function render(){const r=filtered();body.innerHTML='';r.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td><strong>${x.clase}</strong></td><td>${x.dia}</td><td>${x.hora}</td><td><span class="badge">${x.sede}</span></td><td>${x.duracion} min</td>`;body.appendChild(tr)});$('n').textContent=r.length;$('c').textContent=new Set(r.map(x=>x.clase)).size;$('s').textContent=new Set(r.map(x=>x.sede)).size;$('summary').textContent=`Mostrando ${r.length} de ${DATA.length} horarios`}[q,day,site,period].forEach(el=>el.addEventListener('input',render));clear.onclick=()=>{q.value='';day.value='';site.value='';period.value='';render()};csv.onclick=()=>{const r=filtered(),quote=v=>`"${String(v).replaceAll('"','""')}"`,txt=['Clase,Día,Hora,Sede,Duración',...r.map(x=>[x.clase,x.dia,x.hora,x.sede,x.duracion].map(quote).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'}));a.download='horarios-phisique.csv';a.click()};render();</script></body></html>
